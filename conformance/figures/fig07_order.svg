<text x="710.0" y="347.8528" font-family="WenQuanYi Zen Hei" font-size="16.8" font-weight="bold" text-anchor="middle" fill="#1f2937" stroke="#1f2937" stroke-width="1.18" stroke-linejoin="round">取指方式：約 5 個週期 → 從 SRAM</text>
<text x="710.0" y="370.0552" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#374151">約 6,081 個週期 → 每道指令經 I2C 讀 EEPROM</text>
<text x="710.0" y="392.2576" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#374151">這決定之後所有時間怎麼看</text>
