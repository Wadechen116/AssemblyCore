<text x="860.0" y="520.5648" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#374151">b02、b05</text>
<text x="500" y="576" font-family="WenQuanYi Zen Hei" font-size="16.2" font-weight="normal" text-anchor="middle" fill="#4b5563">這四組彼此獨立，哪一組的條件先具備就先做；每完成一支都可以回報，不必等全部做完</text>
