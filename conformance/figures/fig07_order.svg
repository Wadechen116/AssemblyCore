<text x="710.0" y="182.0552" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#374151">多半是載入、位元組序或區段位置的問題</text>
<text x="710.0" y="204.2576" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#374151">後面的測試都以它為前提</text>
