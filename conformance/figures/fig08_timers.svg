<circle cx="256" cy="394" r="6" fill="#3b6fb5"/>
<text x="256" y="426" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="bold" text-anchor="middle" fill="#3b6fb5">RES+1</text>
<text x="34" y="480" font-family="WenQuanYi Zen Hei" font-size="16.8" font-weight="bold" text-anchor="start" fill="#1f2937">Peri</text>
<line x1="110" y1="494" x2="800" y2="494" stroke="#c9ced6" stroke-width="1.2"/>
