<text x="184" y="526" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="bold" text-anchor="middle" fill="#c0392b">RES+8 提前出現</text>
<text x="420" y="372" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="start" fill="#6b7280">（之後和上面相同）</text>
