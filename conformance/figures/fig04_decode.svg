<text x="810.0" y="118.84639999999999" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#374151">00 EXEC_CSR　01 分支</text>
<text x="810.0" y="140.2832" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#374151">10 MOV　　　11 ALU</text>
<text x="40" y="232" font-family="WenQuanYi Zen Hei" font-size="17.4" font-weight="bold" text-anchor="start" fill="#1f2937">② 用 arg 查描述子表</text>
