<text x="185.0" y="272.12800000000004" font-family="WenQuanYi Zen Hei" font-size="16.2" font-weight="bold" text-anchor="middle" fill="#1f2937">CSR 單位元組描述子[0]</text>
<text x="185.0" y="293.56480000000005" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#374151">位於 layout 的位移 24</text>
<line x1="310" y1="277" x2="370" y2="277" stroke="#6b7280" stroke-width="1.8"/>
<polygon points="370.0,277.0 359.0,282.0 359.0,272.0" fill="#6b7280"/>
<rect x="370" y="248" width="130" height="58" rx="6" fill="#e7f4ea" stroke="#3d8b56" stroke-width="1.6"/>
<text x="435.0" y="285.352" font-family="WenQuanYi Zen Hei" font-size="23.2" font-weight="bold" text-anchor="middle" fill="#1f2937">0x0600</text>
<line x1="500" y1="277" x2="560" y2="277" stroke="#6b7280" stroke-width="1.8"/>
<polygon points="560.0,277.0 549.0,282.0 549.0,272.0" fill="#6b7280"/>
<rect x="560" y="240" width="400" height="74" rx="6" fill="#fffbe6" stroke="#b59b2a" stroke-width="1.6"/>
<text x="760.0" y="272.12800000000004" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#374151">bit 15:14 = 00 → WRITE8（直接寫入）</text>
<text x="760.0" y="293.56480000000005" font-family="WenQuanYi Zen Hei" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#374151">bit 11:0 = 0x600 → CSR 位址</text>
<text x="40" y="362" font-family="WenQuanYi Zen Hei" font-size="17.4" font-weight="bold" text-anchor="start" fill="#1f2937">③ 指令的下一個位元組是立即值</text>
<rect x="60" y="376" width="120" height="44" rx="6" fill="#e8f0fb" stroke="#3b6fb5" stroke-width="1.6"/>
<text x="120.0" y="405.9344" font-family="WenQuanYi Zen Hei" font-size="22.0" font-weight="bold" text-anchor="middle" fill="#1f2937">0x5A</text>
<line x1="180" y1="398" x2="370" y2="398" stroke="#6b7280" stroke-width="1.8"/>
<polygon points="370.0,398.0 359.0,403.0 359.0,393.0" fill="#6b7280"/>
<text x="275" y="390" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#4b5563">要寫入的值</text>
<rect x="370" y="372" width="590" height="52" rx="6" fill="#fff1dc" stroke="#c0771a" stroke-width="1.6"/>
<text x="665.0" y="404.4728" font-family="WenQuanYi Zen Hei" font-size="18.0" font-weight="bold" text-anchor="middle" fill="#1f2937">結果：CSR 匯流排上出現一次寫入　位址 0x600　值 0x5A</text>
</svg>
