<text x="292" y="162" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#c0771a">bit 7:6</text>
<text x="292" y="180" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="bold" text-anchor="middle" fill="#c0771a">opcode = 00</text>
<text x="468" y="162" font-family="WenQuanYi Zen Hei" font-size="15.1" font-weight="normal" text-anchor="middle" fill="#3d8b56">bit 5:0</text>
<text x="468" y="180" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="bold" text-anchor="middle" fill="#3d8b56">arg = 0（描述子的索引）</text>
<rect x="660" y="78" width="300" height="70" rx="6" fill="#f4f5f7" stroke="#8a93a0" stroke-width="1.6"/>
