<text x="730.0" y="346.78000000000003" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151">A = 27　B = 67</text>
<text x="730.0" y="369.748" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151">（67 − 27）÷（12 − 4）＝ 5 個週期</text>
<text x="730.0" y="392.716" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151">其中取指 4、執行 1</text>
