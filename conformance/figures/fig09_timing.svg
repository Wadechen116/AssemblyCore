<rect x="60" y="290" width="420" height="124" rx="6" fill="#fffbe6" stroke="#b59b2a" stroke-width="1.6"/>
<text x="270.0" y="312.32800000000003" font-family="WenQuanYi Zen Hei" font-size="17.4" font-weight="bold" text-anchor="middle" fill="#1f2937" stroke="#1f2937" stroke-width="1.22" stroke-linejoin="round">一道指令的時間</text>
<text x="270.0" y="335.29600000000005" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151">＝（B − A）÷（N2 − N1）</text>
<text x="270.0" y="358.264" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151"></text>
<text x="270.0" y="381.232" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151">每一段都含一次標記寫入的時間，</text>
<text x="270.0" y="404.20000000000005" font-family="WenQuanYi Zen Hei" font-size="15.7" font-weight="normal" text-anchor="middle" fill="#374151">相減之後正好消掉</text>
<rect x="520" y="290" width="420" height="124" rx="6" fill="#f4f5f7" stroke="#8a93a0" stroke-width="1.6"/>
