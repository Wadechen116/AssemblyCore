; What the board's CSRs of conf_board.inc DO, for this project's simulator (asmsim --env). The hardware needs no such file.
[csr POLL_MASK]
kind = value
bind = poll_mask
[csr POLL_CTRL]
kind = action
bit0 = poll_clear
bit1 = poll_arm
[csr PERI_CTRL]
kind = action
bit0 = done_set
bit1 = error_set
bit2 = service_reset
bit3 = timer_start
[csr PERI_TPER]
kind = value
bind = timer_period
bytes = 2
[csr MAIN_TPER]
kind = value
bind = main_timer_period
bytes = 2
[csr MAIN_CTRL]
kind = action
bit0 = main_timer_start
