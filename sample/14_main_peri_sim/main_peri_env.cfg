; Environment for main_peri.asm  (format: docs/SIM.md)
[sim]
tie_order = main peri

; a SHORT frame so that a few of them fit in a run you can look at: 4000 cycles, the blanking window at 3000 .. 3900
[timing]
frame_cycles = 4000
vblank_start = 3000
vblank_len   = 900

; the commit is always "pending" in this example; the WCET of the commit (frame.wcet_pgl) is a parameter: see main_peri.simparams
[inject]
at 0 = signal pgl_pending=1

[csr POLL_MASK]
kind = value
bind = poll_mask

[csr POLL_CTRL]
kind = action
bit0 = poll_clear
bit1 = poll_arm

[csr PERI_CTRL]
kind = action
bit0 = done_set
bit1 = error_set
bit2 = service_reset
bit3 = timer_start

[csr PERI_TPER]
kind = value
bind = timer_period
bytes = 2

[csr MAIN_TPER]
kind = value
bind = main_timer_period
bytes = 2

[csr MAIN_CTRL]
kind = action
bit0 = main_timer_start

[device imu]
addr = 0x68
block 0x43 = 0x00 0x0A 0x00 0x14 0x00 0x1E        ; gyro X, Y, Z: 16-bit big-endian (10, 20, 30)
