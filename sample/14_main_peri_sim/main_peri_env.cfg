; Environment for main_peri.asm  (format: docs/SIM.md)
[sim]
tie_order = main peri

; a real frame: every instruction is read from the I2C EEPROM first (thousands of cycles each), so the frame of spec 14 is used
[timing]
frame_cycles = 450000                 ; 27 MHz / 60 fps (spec 14: 1288 x 752 total lines)
vblank_start = 435638                 ; the vertical blanking window: the last 14,362 cycles of the frame (spec 14)
vblank_len   = 14362

; the commit is always "pending" in this example; the WCET of the commit (frame.wcet_pgl) is a parameter: see main_peri.simparams
[inject]
at 0 = signal pgl_pending=1

[csr POLL_MASK]
kind = value
bind = poll_mask

[csr POLL_CTRL]
kind = action
bit0 = poll_clear
bit1 = poll_arm

[csr PERI_CTRL]
kind = action
bit0 = done_set
bit1 = error_set
bit2 = service_reset
bit3 = timer_start

[csr PERI_TPER]
kind = value
bind = timer_period
bytes = 2

[csr MAIN_TPER]
kind = value
bind = main_timer_period
bytes = 2

[csr MAIN_CTRL]
kind = action
bit0 = main_timer_start

[device imu]
addr = 0x68
block 0x43 = 0x00 0x0A 0x00 0x14 0x00 0x1E        ; gyro X, Y, Z: 16-bit big-endian (10, 20, 30)
