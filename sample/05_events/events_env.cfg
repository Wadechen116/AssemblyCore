; The IMU that Peri polls (gives the Peri flow something to do between checkpoints).
[device imu]
addr = 0x68
reg 0x3A = 0x01

; Events are injected from here, so they also arrive when you debug in the IDE (the IDE has no "inject" dialog yet).
; "event main|peri id=N" makes event N pending in that domain; it is dispatched at the next 'safe' branch.
[inject]
at 200 = event main id=0
at 300 = event peri id=0
at 500 = event main id=0
at 800 = event main id=1
