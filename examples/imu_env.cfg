; Environment for examples/imu_gyro.asm  (format: docs/SIM.md)
[sim]
tie_order = main peri

; spec 14.1: 27 MHz, 60 fps, 1288 x 752 total, 24 blanking lines at the end of the frame
[timing]
frame_cycles = 450000
vblank_start = 435638
vblank_len   = 14362

; CSRs with behaviour. The addresses come from the program's .csr lines; a CSR that is not listed behaves as plain RAM.
[csr POLL_MASK]
kind = value
bind = poll_mask

[csr POLL_CTRL]
kind = action
bit0 = poll_clear
bit1 = poll_arm

[csr PERI_CTRL]
kind = action
bit0 = done_set
bit1 = error_set
bit2 = service_reset
bit3 = timer_start

[csr PERI_TPER]
kind = value
bind = timer_period
bytes = 2

; the IMU at I2C address 0x68
[device imu]
addr = 0x68
reg 0x3A = 0x00, 0x00, 0x01          ; status: data ready from the third read on
block 0x43 = 0x00 0x0A 0x00 0x14 0x00 0x1E   ; gyro X, Y, Z as an MPU sends them: 16-bit BIG-endian, high byte first (10, 20, 30)
